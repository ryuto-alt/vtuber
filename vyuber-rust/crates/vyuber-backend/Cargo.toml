[package]
name = "vyuber-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "vyuber_backend"
path = "src/lib.rs"

[[bin]]
name = "vyuber-backend"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart", "ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { workspace = true }

# WebSocket & Async Utilities
futures = "0.3"

# Whisper (ローカル音声認識)
# GPU加速: CUDA Toolkit インストール後に features = ["cuda"] を追加
whisper-rs = "0.15"

# RTMP (placeholder)
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.5"
futures-util = "0.3"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { version = "1.11", features = ["v4"] }
once_cell = "1.20"

# Error Handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# 形態素解析 (日本語テキスト補完)
lindera = { version = "2", features = ["embed-ipadic"] }
strsim = "0.11"

# Shared Types
vyuber-shared = { workspace = true }